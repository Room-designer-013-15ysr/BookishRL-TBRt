<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emma Skies 2026 Reading Tracker</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary: #6c5ce7;
      --primary-light: #a29bfe;
      --text: #2d3436;
      --text-muted: #636e72;
      --border: #dfe6e9;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; color: var(--primary); margin: 0 0 5px 0; }
    header p { color: var(--text-muted); margin: 0; }

    /* Dashboard Stats Grid */
    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
    .stat-card h4 { margin: 0; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
    .stat-card .value { font-size: 1.8rem; font-weight: bold; color: var(--primary); margin-top: 5px; }

    /* Visual Analytics Graphs */
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .chart-card { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border); }
    .chart-card h3 { margin: 0 0 15px 0; font-size: 1.1rem; color: var(--text); }
    
    .bar-group { margin-bottom: 12px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
    .bar-bg { background: #e0e0e0; height: 12px; border-radius: 6px; overflow: hidden; }
    .bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.4s ease; }

    /* Form Layout */
    .form-card { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 30px; }
    .form-card h2 { margin-top: 0; font-size: 1.3rem; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: 1 / -1; }
    label { font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text-muted); }
    input, select, textarea { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
    button.btn-submit { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; font-size: 1rem; }
    button.btn-submit:hover { background: #5b4bc4; }

    /* Books Grid */
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .book-card { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
    .book-cover { height: 180px; background: #eee; background-size: cover; background-position: center; }
    .book-details { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .book-title { font-size: 1.1rem; font-weight: bold; margin: 0 0 5px 0; }
    .book-author { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
    .tag { display: inline-block; background: var(--primary-light); color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 5px; }
    .quote-box { font-style: italic; background: #f1f2f6; padding: 8px; border-left: 3px solid var(--primary); margin-top: 10px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Emma Skies 2026 Reading Tracker</h1>
      <p>Personal Reading Analytics & Log</p>
    </header>

    <!-- Stat Summary Cards -->
    <div class="dashboard">
      <div class="stat-card">
        <h4>Total Books</h4>
        <div class="value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <h4>Pages Read</h4>
        <div class="value" id="stat-pages">0</div>
      </div>
      <div class="stat-card">
        <h4>Avg Rating</h4>
        <div class="value" id="stat-rating">0.0 ★</div>
      </div>
      <div class="stat-card">
        <h4>Books Finished</h4>
        <div class="value" id="stat-finished">0</div>
      </div>
    </div>

    <!-- Analytics Graphs -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Reading Status Breakdown</h3>
        <div class="bar-group">
          <div class="bar-label"><span>Finished</span><span id="label-finished">0</span></div>
          <div class="bar-bg"><div class="bar-fill" id="bar-finished"></div></div>
        </div>
        <div class="bar-group">
          <div class="bar-label"><span>Currently Reading</span><span id="label-reading">0</span></div>
          <div class="bar-bg"><div class="bar-fill" id="bar-reading"></div></div>
        </div>
        <div class="bar-group">
          <div class="bar-label"><span>To Read</span><span id="label-toread">0</span></div>
          <div class="bar-bg"><div class="bar-fill" id="bar-toread"></div></div>
        </div>
      </div>

      <div class="chart-card">
        <h3>Format Distribution</h3>
        <div id="format-charts">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>

    <!-- Book Entry Form -->
    <div class="form-card">
      <h2>Add a New Book</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="title" required placeholder="e.g. The Hobbit">
        </div>
        <div class="form-group">
          <label>Author *</label>
          <input type="text" id="author" required placeholder="e.g. J.R.R. Tolkien">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="To Read">To Read</option>
            <option value="Reading">Reading</option>
            <option value="Finished">Finished</option>
          </select>
        </div>
        <div class="form-group">
          <label>Rating (1-5 Stars)</label>
          <select id="rating">
            <option value="0">Unrated</option>
            <option value="5">5 Stars ★★★★★</option>
            <option value="4">4 Stars ★★★★☆</option>
            <option value="3">3 Stars ★★★☆☆</option>
            <option value="2">2 Stars ★★☆☆☆</option>
            <option value="1">1 Star ★☆☆☆☆</option>
          </select>
        </div>
        <div class="form-group">
          <label>Format</label>
          <select id="format">
            <option value="Paperback">Paperback</option>
            <option value="Hardcover">Hardcover</option>
            <option value="eBook">eBook</option>
            <option value="Audiobook">Audiobook</option>
          </select>
        </div>
        <div class="form-group">
          <label>Page Count</label>
          <input type="number" id="pages" placeholder="e.g. 310">
        </div>
        <div class="form-group">
          <label>Date Started</label>
          <input type="date" id="dateStarted">
        </div>
        <div class="form-group">
          <label>Date Finished</label>
          <input type="date" id="dateFinished">
        </div>
        <div class="form-group full-width">
          <label>Cover Image URL (Optional)</label>
          <input type="url" id="coverUrl" placeholder="https://...">
        </div>
        <div class="form-group full-width">
          <label>Favorite Quote / Thoughts</label>
          <textarea id="notes" rows="2" placeholder="Key takeaways or quotes..."></textarea>
        </div>
      </div>
      <button class="btn-submit" onclick="addBook()">Save Book to Library</button>
    </div>

    <!-- Books Library Display -->
    <h2>Library Collection</h2>
    <div class="books-grid" id="books-grid">
      <!-- Dynamically generated book cards -->
    </div>
  </div>

  <script>
    // Relative API route for single-host setup on Render
    const API_URL = '/api/books';

    async function fetchBooks() {
      try {
        const res = await fetch(API_URL);
        const books = await res.json();
        renderDashboard(books);
        renderBooksGrid(books);
      } catch (err) {
        console.error('Error fetching library:', err);
      }
    }

    function renderDashboard(books) {
      const total = books.length;
      const finished = books.filter(b => b.status === 'Finished').length;
      const reading = books.filter(b => b.status === 'Reading').length;
      const toread = books.filter(b => b.status === 'To Read').length;
      
      const totalPages = books.reduce((sum, b) => sum + (Number(b.pages) || 0), 0);
      const ratedBooks = books.filter(b => Number(b.rating) > 0);
      const avgRating = ratedBooks.length > 0 
        ? (ratedBooks.reduce((sum, b) => sum + Number(b.rating), 0) / ratedBooks.length).toFixed(1) 
        : '0.0';

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-pages').innerText = totalPages.toLocaleString();
      document.getElementById('stat-rating').innerText = `${avgRating} ★`;
      document.getElementById('stat-finished').innerText = finished;

      // Update Breakdown Chart Bars
      document.getElementById('label-finished').innerText = finished;
      document.getElementById('bar-finished').style.width = total ? `${(finished / total) * 100}%` : '0%';

      document.getElementById('label-reading').innerText = reading;
      document.getElementById('bar-reading').style.width = total ? `${(reading / total) * 100}%` : '0%';

      document.getElementById('label-toread').innerText = toread;
      document.getElementById('bar-toread').style.width = total ? `${(toread / total) * 100}%` : '0%';

      // Formats Chart
      const formats = {};
      books.forEach(b => {
        const f = b.format || 'Unspecified';
        formats[f] = (formats[f] || 0) + 1;
      });

      const formatContainer = document.getElementById('format-charts');
      formatContainer.innerHTML = '';
      Object.keys(formats).forEach(fmt => {
        const count = formats[fmt];
        const pct = total ? (count / total) * 100 : 0;
        formatContainer.innerHTML += `
          <div class="bar-group">
            <div class="bar-label"><span>${fmt}</span><span>${count}</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width: ${pct}%;"></div></div>
          </div>
        `;
      });
    }

    function renderBooksGrid(books) {
      const grid = document.getElementById('books-grid');
      grid.innerHTML = '';

      if (books.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted);">Your library is currently empty. Add a book above!</p>';
        return;
      }

      books.forEach(b => {
        const cover = b.coverurl || 'https://via.placeholder.com/300x180?text=No+Cover';
        const stars = b.rating > 0 ? '★'.repeat(b.rating) : 'Unrated';

        grid.innerHTML += `
          <div class="book-card">
            <div class="book-cover" style="background-image: url('${cover}')"></div>
            <div class="book-details">
              <div>
                <div class="book-title">${b.title}</div>
                <div class="book-author">by ${b.author}</div>
                <div>
                  <span class="tag">${b.status}</span>
                  <span class="tag" style="background:#74b9ff;">${b.format || 'Book'}</span>
                </div>
              </div>
              <div>
                <div style="margin-top:10px; font-weight:bold; color:#f1c40f;">${stars}</div>
                ${b.notes ? `<div class="quote-box">"${b.notes}"</div>` : ''}
              </div>
            </div>
          </div>
        `;
      });
    }

    async function addBook() {
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;

      if (!title || !author) {
        alert('Please fill out the Title and Author fields.');
        return;
      }

      const payload = {
        title,
        author,
        status: document.getElementById('status').value,
        rating: document.getElementById('rating').value,
        format: document.getElementById('format').value,
        pages: document.getElementById('pages').value,
        dateStarted: document.getElementById('dateStarted').value,
        dateFinished: document.getElementById('dateFinished').value,
        coverUrl: document.getElementById('coverUrl').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // Clear input values
        document.getElementById('title').value = '';
        document.getElementById('author').value = '';
        document.getElementById('notes').value = '';
        document.getElementById('coverUrl').value = '';

        fetchBooks();
      } catch (err) {
        alert('Error saving book.');
      }
    }

    fetchBooks();
  </script>
</body>
</html>
